name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch the plugin API (compile-only, provided by the host at runtime)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p deps
          gh release download v1.0.93 --repo risa-labs-inc/boss-plugin-api \
            --pattern "boss-plugin-api-1.0.93.jar" --dir deps
      - name: Test and build the plugin JAR
        run: ./gradlew test buildPluginJar --no-daemon
      - name: Upload the plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: boss-plugin-xray
          path: build/libs/boss-plugin-xray-*.jar
